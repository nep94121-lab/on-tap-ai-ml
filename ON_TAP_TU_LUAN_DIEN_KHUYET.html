<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Tự Luận & Điền Khuyết - AI & ML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #059669;
            --success-light: #d1fae5;
            --warning: #d97706;
            --warning-light: #fef3c7;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .question-card:hover {
            transform: translateY(-2px);
        }

        .question-header {
            padding: 16px 20px;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .question-number {
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .question-type-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-fill {
            background: var(--warning-light);
            color: var(--warning);
        }

        .badge-match {
            background: #dbeafe;
            color: #2563eb;
        }

        .badge-arrange {
            background: #f3e8ff;
            color: #9333ea;
        }

        .badge-essay {
            background: var(--success-light);
            color: var(--success);
        }

        .question-content {
            padding: 20px;
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .input-section {
            margin-top: 20px;
        }

        .input-section label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-gray);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle {
            background: var(--primary);
            color: white;
            margin-top: 16px;
        }

        .btn-toggle:hover {
            background: var(--primary-dark);
        }

        .btn-toggle.active {
            background: var(--success);
        }

        .answer-section {
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .answer-section.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-box {
            background: var(--success-light);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 16px;
        }

        .answer-label {
            font-weight: 600;
            color: var(--success);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .answer-content {
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .answer-content strong {
            color: var(--success);
        }

        /* Matching Section Styles */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 16px;
        }

        @media (max-width: 600px) {
            .matching-container {
                grid-template-columns: 1fr;
            }
        }

        .match-column {
            background: var(--bg-light);
            border-radius: 8px;
            padding: 12px;
        }

        .match-column h4 {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-item {
            padding: 10px 12px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .match-item:hover {
            border-color: var(--primary);
            background: #f0f4ff;
        }

        .match-item.selected {
            border-color: var(--primary);
            background: #e0e7ff;
        }

        .match-item .item-id {
            font-weight: 600;
            color: var(--primary);
            margin-right: 8px;
        }

        /* Arrange Section Styles */
        .arrange-container {
            margin-top: 16px;
        }

        .arrange-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
        }

        .arrange-item:hover {
            border-color: var(--primary);
        }

        .arrange-item.dragging {
            opacity: 0.5;
            border-color: var(--primary);
            background: #f0f4ff;
        }

        .arrange-item .step-number {
            width: 28px;
            height: 28px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .arrange-item .drag-handle {
            color: var(--text-gray);
            cursor: grab;
        }

        .arrange-item .step-content {
            flex: 1;
            font-size: 0.9rem;
        }

        /* Fill in blank styles */
        .blank-input {
            display: inline-block;
            min-width: 120px;
            padding: 4px 8px;
            border: 2px solid var(--primary);
            border-radius: 4px;
            font-size: inherit;
            background: #f0f4ff;
        }

        /* Navigation */
        .nav-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        /* Scenario solution styles */
        .scenario-section {
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .scenario-section h4 {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* Code block styles */
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 12px 0;
        }

        code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        pre code {
            background: none;
            padding: 0;
        }

        /* Table styles for matching */
        .match-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .match-table th,
        .match-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .match-table th {
            background: var(--bg-light);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .match-table td {
            font-size: 0.9rem;
        }

        .match-table .col-a {
            width: 25%;
            font-weight: 600;
            color: var(--primary);
        }

        .match-table .arrow {
            width: 15%;
            text-align: center;
            color: var(--text-gray);
        }

        .match-table .col-b {
            width: 60%;
        }

        @media (max-width: 600px) {
            .match-table {
                display: block;
            }

            .match-table thead {
                display: none;
            }

            .match-table tbody {
                display: block;
            }

            .match-table tr {
                display: block;
                margin-bottom: 16px;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 12px;
            }

            .match-table td {
                display: block;
                padding: 4px 0;
                border: none;
            }

            .match-table .col-a {
                font-size: 1rem;
            }

            .match-table .arrow {
                display: none;
            }

            .match-table .col-b::before {
                content: "→ ";
                font-weight: bold;
                color: var(--primary);
            }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }

        .scroll-top {
            display: none;
        }

        .scroll-top.visible {
            display: flex;
        }

        /* Highlight keyword */
        .keyword {
            background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>

    <script>
        // Question data
        const questions = [
            {
                id: 53,
                title: "Bài 1: Điền từ vào chỗ trống",
                type: "fill",
                typeLabel: "Điền từ",
                track: "Track 1",
                question: `Điền vào chỗ trống để hoàn chỉnh mô tả vòng lặp ReAct agent:

Trong ReAct pattern, mỗi iteration của vòng lặp agent gồm 3 bước theo thứ tự: [1] → [2] → [3].

Bước [2] là nơi agent thực tế gọi tool hoặc thực hiện hành động, còn bước [3] là kết quả trả về từ tool được đưa vào context.`,
                answer: `[1] = Thought (Suy nghĩ / Lập luận)
[2] = Action (Hành động / Gọi công cụ)
[3] = Observation (Quan sát / Kết quả nhận về)

Giải thích:
• Thought: Agent suy nghĩ và lập luận về hành động tiếp theo
• Action: Agent thực hiện hành động hoặc gọi tool
• Observation: Kết quả trả về từ tool được đưa vào context cho vòng lặp tiếp theo`
            },
            {
                id: 54,
                title: "Bài 2: Điền tham số API",
                type: "fill",
                typeLabel: "Điền tham số API",
                track: "Track 2",
                question: `Điền tên tham số API LLM phù hợp vào chỗ trống:

Trong API LLM (OpenAI, Anthropic):

• Tham số [1] kiểm soát mức độ ngẫu nhiên của output (0 = deterministic, giá trị cao = creative/random).
• Tham số [2] giới hạn độ dài tối đa của response tính bằng tokens.
• Tham số [3] kiểm soát xác suất tích lũy của token pool được sample (nucleus sampling).`,
                answer: `[1] = temperature
[2] = max_tokens (hoặc max_completion_tokens)
[3] = top_p

Giải thích:
• temperature: 0 = hoàn toàn deterministic, 1.0 = ngẫu nhiên cao
• max_tokens: giới hạn độ dài response
• top_p: nucleus sampling, kiểm soát đa dạng output`
            },
            {
                id: 55,
                title: "Bài 3: Điền từ vào chỗ trống",

                typeLabel: "Điền từ",

                question: `Điền vào chỗ trống để mô tả đúng quy trình tìm kiếm ngữ nghĩa:

Trong vector database, việc đo khoảng cách giữa 2 vectors thường dùng độ đo [2] (cosine similarity hoặc dot product).

Kết quả trả về là top-k chunks có độ tương đồng ngữ nghĩa cao nhất với query vector, được gọi là quá trình [3].`,
                answer: `[1] = Embedding (hoặc Vectorization)
[2] = Cosine similarity (hoặc Vector distance metric)
[3] = Retrieval (Truy xuất / Vector search / Semantic retrieval)

Giải thích:
• Embedding: chuyển đổi text thành dense vector
• Cosine similarity: đo độ tương đồng giữa 2 vectors
• Retrieval: truy xuất các chunks có độ tương đồng cao nhất`
            },
            {
                id: 56,
                title: "Bài 4: Ghép nối định nghĩa",

                typeLabel: "Ghép nối",

                    { id: "A4", text: "LLM" },
                    { id: "A5", text: "Transformer" }

                columnB: [
                    { id: "B1", text: "Mô hình ngôn ngữ lớn được huấn luyện trên khối lượng khổng lồ văn bản để hiểu và sinh ngôn ngữ tự nhiên." },
                    { id: "B2", text: "Kiến trúc mạng nơ-ron dựa trên cơ chế Self-Attention, là nền tảng của hầu hết các mô hình LLM hiện đại." },
                    { id: "B3", text: "Nhóm AI có khả năng lập kế hoạch nhiều bước, sử dụng công cụ bên ngoài và tự điều chỉnh hành vi để đạt mục tiêu." },

A5 — B2: Transformer — Kiến trúc dựa trên Self-Attention làm nền tảng cho LLM.`

                track: "Track 1",
                question: `Cho use case: 'Hệ thống tự động phân tích customer feedback: phân loại sentiment, extract topics, và generate summary report'.

                answer: `Bản thiết kế kiến trúc Supervisor-Worker:

def run_agent(query, max_iterations=5):
    messages = [
        {"role": "system", "content": SYSTEM_PROMPT},
        {"role": "user", "content": query}
    ]

    for step in range(max_iterations):
        # LLM sinh Thought và Action
        response = call_llm(messages)
        messages.append({"role": "assistant", "content": response})

        # Phân tích cú pháp xem có Final Answer chưa

        # Bóc tách tool và tham số

        try:
            observation = execute_tool(action_name, action_args)

        # Đưa Observation trở lại context
        messages.append({"role": "user", "content": f"Observation: {observation}"})

                                    <span>&#10004;</span> Đáp án mẫu
                                </div>
                                <div class="answer-content">${q.answer}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderScenarioQuestion(q, index) {
            const sections = q.answer.split('---').map((section, i) => {
                const [title, ...content] = section.trim().split('\n');
                return `
                    <div class="scenario-section">
                        <h4>${title}</h4>
                        <div>${content.join('\n')}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="question-card" id="q${q.id}">
                    <div class="question-header">
                        <span class="question-number">${index}</span>
                        <span class="question-type-badge badge-essay">${q.typeLabel}</span>
                        <span style="color: var(--text-gray); font-size: 0.85rem;">${q.track}</span>
                    </div>
                    <div class="question-content">
                        <div class="question-text">${q.question}</div>
                        <div class="input-section">
                            <label>Trả lời của bạn (theo từng ý):</label>
                            <textarea style="min-height: 200px;" placeholder="Chia câu trả lời theo các ý như trong đề bài..."></textarea>
                        </div>
                        <button class="btn btn-toggle" onclick="toggleAnswer('${q.id}', this)">
                            <span>&#128065;</span> Hiển thị đáp án
                        </button>
                        <div class="answer-section" id="answer-${q.id}">
                            <div class="answer-box">
                                <div class="answer-label">
                                    <span>&#10004;</span> Gợi ý & Đáp án
                                </div>
                                <div class="answer-content">${sections}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render all questions
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            let html = '';

            questions.forEach((q, index) => {
                switch(q.type) {
                    case 'fill':
                        html += renderFillQuestion(q, index + 1);
                        break;
                    case 'match':
                        html += renderMatchQuestion(q, index + 1);
                        break;
                    case 'arrange':
                        html += renderArrangeQuestion(q, index + 1);
                        break;
                    case 'essay':
                        html += renderEssayQuestion(q, index + 1);
                        break;
                    case 'scenario':
                        html += renderScenarioQuestion(q, index + 1);
                        break;
                }
            });

            container.innerHTML = html;
        }

        // Toggle answer visibility
        function toggleAnswer(id, btn) {
            const answerSection = document.getElementById('answer-' + id);
            const isVisible = answerSection.classList.contains('show');

            if (isVisible) {
                answerSection.classList.remove('show');
                btn.classList.remove('active');
                btn.innerHTML = '<span>&#128065;</span> Hiển thị đáp án';
            } else {
                answerSection.classList.add('show');
                btn.classList.add('active');
                btn.innerHTML = '<span>&#128065;</span> Ẩn đáp án';

                // Scroll to answer
                answerSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Drag and drop functions
        let draggedItem = null;

        function dragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function drop(e) {
            e.preventDefault();
            if (this !== draggedItem) {
                const container = this.parentNode;
                const allItems = [...container.querySelectorAll('.arrange-item')];
                const draggedIndex = allItems.indexOf(draggedItem);
                const targetIndex = allItems.indexOf(this);

                if (draggedIndex < targetIndex) {
                    container.insertBefore(draggedItem, this.nextSibling);
                } else {
                    container.insertBefore(draggedItem, this);
                }

                // Update step numbers
                updateStepNumbers(container);
            }
        }

        function dragEnd(e) {
            this.classList.remove('dragging');
            draggedItem = null;
        }

        function updateStepNumbers(container) {
            const items = container.querySelectorAll('.arrange-item');
            items.forEach((item, index) => {
                item.querySelector('.step-number').textContent = index + 1;
            });
        }

        // Show all answers
        document.getElementById('showAll').addEventListener('click', function() {
            const allAnswers = document.querySelectorAll('.answer-section');
            const allButtons = document.querySelectorAll('.btn-toggle');
            const isAllVisible = [...allAnswers].every(a => a.classList.contains('show'));

            allAnswers.forEach(answer => {
                if (isAllVisible) {
                    answer.classList.remove('show');
                } else {
                    answer.classList.add('show');
                }
            });

            allButtons.forEach(btn => {
                if (isAllVisible) {
                    btn.classList.remove('active');
                    btn.innerHTML = '<span>&#128065;</span> Hiển thị đáp án';
                } else {
                    btn.classList.add('active');
                    btn.innerHTML = '<span>&#128065;</span> Ẩn đáp án';
                }
            });
        });

        // Scroll to top
        document.getElementById('scrollTop').addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Show/hide scroll button
        window.addEventListener('scroll', function() {
            const scrollTop = document.getElementById('scrollTop');
            if (window.pageYOffset > 300) {
                scrollTop.classList.add('visible');
            } else {
                scrollTop.classList.remove('visible');
            }
        });

        // Initialize
        renderQuestions();
    </script>
</body>
</html>
