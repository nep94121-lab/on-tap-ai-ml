    let answeredCount = 0;

    const answeredQuestions = new Set();

    function renderQuestions() {
      const container = document.getElementById('questions-container');

      questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `question-${q.id}`;

        const correctLetter = Array.isArray(q.correct) ? q.correct[0] : q.correct;
        const isMultiAnswer = Array.isArray(q.correct);

        card.innerHTML = `
          <div class="question-header">
            <div class="question-number">${index + 1}</div>
            <div class="question-text">${q.question}</div>
          </div>
          <div class="choices" id="choices-${q.id}">
            ${q.choices.map((choice, i) => {
              const letter = String.fromCharCode(65 + i);
              return `
                <div class="choice" data-question="${q.id}" data-letter="${letter}" onclick="selectChoice(${q.id}, '${letter}')">
                  <div class="choice-letter">${letter}</div>
                  <div class="choice-text">${choice.substring(3)}</div>
                </div>
              `;
            }).join('')}
          </div>
          <button class="btn-explain" id="btn-${q.id}" onclick="toggleExplanation(${q.id})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            Hien Thi Giai Thich
          </button>
          <div class="explanation" id="explanation-${q.id}">
            <div class="explanation-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"></path>
              </svg>
              Loi Giai Chi Tiet
            </div>
            <div class="correct-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Dap an dung: ${isMultiAnswer ? q.correct.join(', ') : q.correct}
            </div>
            <div class="explanation-text">${q.explanation.replace(/\n/g, '<br>')}</div>
            <div class="track-tag ${q.track.includes('Track 1') ? 'track1' : q.track.includes('Track 2') ? 'track2' : 'track3'}">${q.track}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function selectChoice(questionId, letter) {
      const q = questions.find(q => q.id === questionId);
      const correctAnswers = Array.isArray(q.correct) ? q.correct : [q.correct];
      const isCorrect = correctAnswers.includes(letter);

      const choicesContainer = document.getElementById(`choices-${questionId}`);
      const choices = choicesContainer.querySelectorAll('.choice');

      // Mark all as shown (disable further selection)
      choices.forEach(choice => {
        choice.style.pointerEvents = 'none';
        const choiceLetter = choice.dataset.letter;

        if (correctAnswers.includes(choiceLetter)) {
          choice.classList.add('correct');
        } else if (choiceLetter === letter && !isCorrect) {
          choice.classList.add('wrong');
        }
      });

      // Update stats if not already answered
      if (!answeredQuestions.has(questionId)) {
        answeredQuestions.add(questionId);
        answeredCount++;
        if (isCorrect) {
          correctCount++;
        }
        updateStats();
      }
    }

    function toggleExplanation(questionId) {
      const explanation = document.getElementById(`explanation-${questionId}`);
      const btn = document.getElementById(`btn-${questionId}`);

      explanation.classList.toggle('show');
      btn.classList.toggle('active');

      if (explanation.classList.contains('show')) {
        btn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          An Giai Thich
        `;
      } else {
        btn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          Hien Thi Giai Thich
        `;
      }
    }

    function updateStats() {
      document.getElementById('answered-count').textContent = answeredCount;
      document.getElementById('correct-count').textContent = correctCount;
    }
