<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Nhiều Đáp Án - AI/ML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e4e4e4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0, 217, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 217, 255, 0.3);
        }

        .stat-item span {
            color: #00d9ff;
            font-weight: bold;
            font-size: 1.3em;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.1);
        }

        .question-card.completed {
            border-color: rgba(0, 255, 136, 0.5);
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.15em;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #fff;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .option-item.correct {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .option-item.incorrect {
            border-color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        .option-item.missed {
            border-color: #ffa502;
            background: rgba(255, 165, 2, 0.1);
        }

        .option-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #00d9ff;
            flex-shrink: 0;
        }

        .option-label {
            font-weight: bold;
            color: #00d9ff;
            margin-right: 8px;
        }

        .option-text {
            flex: 1;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-check {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #1a1a2e;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 217, 255, 0.4);
        }

        .btn-explain {
            background: linear-gradient(135deg, #ffa502, #ff7f00);
            color: #1a1a2e;
        }

        .btn-explain:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 165, 2, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .result-correct {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .result-incorrect {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
        }

        .result-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .explanation-box {
            margin-top: 15px;
            padding: 20px;
            background: rgba(255, 165, 2, 0.1);
            border: 1px solid rgba(255, 165, 2, 0.3);
            border-radius: 10px;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-title {
            color: #ffa502;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-content {
            line-height: 1.7;
            color: #e4e4e4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.6em;
            }
            .stats-bar {
                gap: 15px;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Trắc Nghiệm Nhiều Đáp Án</h1>
            <p>Chọn TẤT CẢ các đáp án đúng cho mỗi câu hỏi</p>
            <div class="stats-bar">
                <div class="stat-item">
                    Hoàn thành: <span id="completedCount">0</span>/<span id="totalCount">5</span>
                </div>
                <div class="stat-item">
                    Đúng: <span id="correctCount">0</span>
                </div>
                <div class="stat-item">
                    Sai: <span id="incorrectCount">0</span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div class="footer">
            <p>Chúc bạn học tốt! 💪</p>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 1,
                question: "Những tình huống nào dưới đây phù hợp với RAG hơn so với Fine-tuning?",
                options: [
                    { label: "A", text: "Agent cần trả lời từ tài liệu nội bộ công ty được cập nhật hàng tuần" },
                    { label: "B", text: "Cần model học phong cách viết thương hiệu đặc thù và nhất quán" },
                    { label: "C", text: "Agent cần truy xuất chính xác từ knowledge base pháp lý hơn 50.000 trang" },
                    { label: "D", text: "Cần model hiểu sâu thuật ngữ y tế chuyên biệt (ICD codes, clinical notes)" },
                    { label: "E", text: "Agent cần biết giá sản phẩm real-time từ catalog cập nhật liên tục" }
                ],
                correctAnswers: ["A", "C", "E"],
                explanation: "RAG vượt trội khi: dữ liệu cập nhật liên tục (A, E), và cần truy xuất chính xác kèm trích dẫn trên kho tri thức khổng lồ (C). Trong khi đó, Fine-tuning phù hợp hơn để định hình văn phong (B) hoặc học ngữ pháp/thuật ngữ miền sâu (D)."
            },
            {
                id: 2,
                question: "Những kỹ thuật nào dưới đây là guardrail hợp lệ cho AI agent trong production?",
                options: [
                    { label: "A", text: "Input validation: detect và block prompt injection patterns trước khi đưa vào LLM" },
                    { label: "B", text: "Output validation: scan response có PII (tên, số điện thoại, CCCD) trước khi trả về user" },
                    { label: "C", text: "Tăng temperature lên 1.8 để model 'suy nghĩ đa dạng hơn' và tránh bị jailbreak" },
                    { label: "D", text: "Human-in-the-loop: yêu cầu human approve khi action có tác động cao (gửi email hàng loạt, xóa data)" },
                    { label: "E", text: "Rate limiting: giới hạn số lượng requests/phút từ một user để tránh abuse và kiểm soát chi phí" }
                ],
                correctAnswers: ["A", "B", "D", "E"],
                explanation: "Các chốt chặn bảo vệ chuẩn production bao gồm lọc dữ liệu đầu vào (A), ẩn danh hóa thông tin nhạy cảm đầu ra (B), phê duyệt của con người cho tác vụ nguy hiểm (D) và giới hạn tần suất truy cập (E). Phương án C sai hoàn toàn vì tăng nhiệt độ lên 1.8 sẽ gây ảo giác nặng và mất kiểm soát."
            },
            {
                id: 3,
                question: "Khi nào nên chuyển từ single agent sang multi-agent architecture?",
                options: [
                    { label: "A", text: "Task cần parallel processing — ví dụ: crawl và summarize 100 URLs đồng thời" },
                    { label: "B", text: "Context window của agent đang chạm giới hạn (>80% capacity) thường xuyên" },
                    { label: "C", text: "Model GPT-4 quá đắt, muốn thay bằng GPT-3.5 cho tốc độ nhanh hơn" },
                    { label: "D", text: "Task gồm nhiều sub-tasks hoàn toàn độc lập có thể chạy song song" },
                    { label: "E", text: "Task đòi hỏi vai trò chuyên biệt: Researcher → Writer → Critic (specialized agents)" }
                ],
                correctAnswers: ["A", "B", "D", "E"],
                explanation: "Kiến trúc Multi-agent cần thiết khi xử lý song song khối lượng lớn (A, D), giảm tải áp lực ngữ cảnh (B) và phân chia vai trò chuyên môn hóa theo quy trình phản biện/tạo tác (E). Phương án C chỉ là bài toán lựa chọn mô hình (Model Selection/Routing)."
            },
            {
                id: 4,
                question: "Những yếu tố nào là best practice khi thiết kế system prompt cho AI agent?",
                options: [
                    { label: "A", text: "Mô tả rõ role, persona và nhiệm vụ chính của agent" },
                    { label: "B", text: "Viết CAPS LOCK để nhấn mạnh các instruction quan trọng" },
                    { label: "C", text: "Định nghĩa output format mong muốn (JSON schema, bullet list, markdown, etc.)" },
                    { label: "D", text: "Liệt kê explicit những gì agent KHÔNG được làm (negative constraints)" },
                    { label: "E", text: "Cung cấp few-shot examples cho task phức tạp hoặc format đặc biệt" }
                ],
                correctAnswers: ["A", "C", "D", "E"],
                explanation: "Thiết kế system prompt chuẩn cần có vai trò (A), định dạng đầu ra rõ ràng (C), các giới hạn cấm làm (D) và ví dụ mẫu few-shot (E). Viết in hoa toàn bộ (B) là thói quen xấu, không đảm bảo tính ổn định trong kỹ nghệ prompt."
            },
            {
                id: 5,
                question: "Những metrics nào cần monitor cho AI agent trong production?",
                options: [
                    { label: "A", text: "Latency P50 và P99 (percentile) của mỗi request" },
                    { label: "B", text: "Token cost per request (input tokens + output tokens × đơn giá model)" },
                    { label: "C", text: "Số lần model weights được updated trong ngày" },
                    { label: "D", text: "Error rate: tool call failures, JSON parsing errors, timeouts" },
                    { label: "E", text: "Task completion rate: % requests đạt được Final Answer thành công" }
                ],
                correctAnswers: ["A", "B", "D", "E"],
                explanation: "Giám sát AI production cần theo dõi độ trễ (A), chi phí token (B), tỷ lệ lỗi gọi công cụ/phân tích cú pháp (D) và tỷ lệ hoàn thành tác vụ thành công (E). Trọng số mô hình nền tảng qua API không được cập nhật từng ngày (C sai)."
            }
        ];

        let completedQuestions = new Set();
        let correctQuestions = new Set();

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = questions.map(q => `
                <div class="question-card" id="question-${q.id}">
                    <span class="question-number">Câu ${q.id}</span>
                    <p class="question-text">${q.question}</p>
                    <ul class="options-list">
                        ${q.options.map(opt => `
                            <li class="option-item" onclick="toggleOption(${q.id}, '${opt.label}')">
                                <input type="checkbox" id="q${q.id}-${opt.label}" onchange="toggleOption(${q.id}, '${opt.label}')">
                                <span class="option-label">${opt.label}.</span>
                                <span class="option-text">${opt.text}</span>
                            </li>
                        `).join('')}
                    </ul>
                    <div class="button-group">
                        <button class="btn btn-check" onclick="checkAnswer(${q.id})">
                            ✓ Kiểm Tra
                        </button>
                        <button class="btn btn-explain" onclick="showExplanation(${q.id})">
                            💡 Giải Thích
                        </button>
                        <button class="btn btn-reset" onclick="resetQuestion(${q.id})">
                            ↺ Làm Lại
                        </button>
                    </div>
                    <div class="result-box" id="result-${q.id}"></div>
                    <div class="explanation-box" id="explanation-${q.id}">
                        <div class="explanation-title">
                            💡 Giải thích
                        </div>
                        <div class="explanation-content">${q.explanation}</div>
                    </div>
                </div>
            `).join('');
        }

        function toggleOption(questionId, label) {
            const checkbox = document.getElementById(`q${questionId}-${label}`);
            const optionItem = checkbox.parentElement;

            if (checkbox.checked) {
                optionItem.style.background = 'rgba(0, 217, 255, 0.15)';
                optionItem.style.borderColor = 'rgba(0, 217, 255, 0.5)';
            } else {
                optionItem.style.background = '';
                optionItem.style.borderColor = '';
            }
        }

        function checkAnswer(questionId) {
            const question = questions.find(q => q.id === questionId);
            const selectedAnswers = question.options
                .filter(opt => document.getElementById(`q${questionId}-${opt.label}`).checked)
                .map(opt => opt.label);

            const resultBox = document.getElementById(`result-${questionId}`);
            const optionItems = document.querySelectorAll(`#question-${questionId} .option-item`);

            // Reset option styles
            optionItems.forEach(item => {
                item.classList.remove('correct', 'incorrect', 'missed');
            });

            // Check each option
            question.options.forEach(opt => {
                const optionItem = optionItems[question.options.indexOf(opt)];
                const isSelected = selectedAnswers.includes(opt.label);
                const isCorrect = question.correctAnswers.includes(opt.label);

                if (isSelected && isCorrect) {
                    optionItem.classList.add('correct');
                } else if (isSelected && !isCorrect) {
                    optionItem.classList.add('incorrect');
                } else if (!isSelected && isCorrect) {
                    optionItem.classList.add('missed');
                }
            });

            // Calculate result
            const isCorrect = selectedAnswers.length === question.correctAnswers.length &&
                selectedAnswers.every(a => question.correctAnswers.includes(a)) &&
                question.correctAnswers.every(a => selectedAnswers.includes(a));

            // Update stats
            completedQuestions.add(questionId);
            if (isCorrect) {
                correctQuestions.add(questionId);
                resultBox.innerHTML = `
                    <span class="result-icon">🎉</span>
                    <strong>CHÍNH XÁC!</strong> Bạn đã chọn đúng tất cả đáp án.
                `;
                resultBox.className = 'result-box show result-correct';
            } else {
                resultBox.innerHTML = `
                    <span class="result-icon">😟</span>
                    <strong>CHƯA ĐÚNG!</strong> Đáp án đúng: ${question.correctAnswers.join(', ')}
                `;
                resultBox.className = 'result-box show result-incorrect';
            }

            updateStats();
            document.getElementById(`question-${questionId}`).classList.add('completed');
        }

        function showExplanation(questionId) {
            const explanationBox = document.getElementById(`explanation-${questionId}`);
            explanationBox.classList.toggle('show');

            // Also check answer if not already checked
            if (!completedQuestions.has(questionId)) {
                checkAnswer(questionId);
            }
        }

        function resetQuestion(questionId) {
            const question = questions.find(q => q.id === questionId);
            const optionItems = document.querySelectorAll(`#question-${questionId} .option-item`);

            // Uncheck all checkboxes and reset styles
            question.options.forEach(opt => {
                const checkbox = document.getElementById(`q${questionId}-${opt.label}`);
                checkbox.checked = false;
            });

            optionItems.forEach(item => {
                item.style.background = '';
                item.style.borderColor = '';
                item.classList.remove('correct', 'incorrect', 'missed');
            });

            // Hide result and explanation
            document.getElementById(`result-${questionId}`).className = 'result-box';
            document.getElementById(`explanation-${questionId}`).className = 'explanation-box';

            // Reset stats for this question
            completedQuestions.delete(questionId);
            correctQuestions.delete(questionId);

            document.getElementById(`question-${questionId}`).classList.remove('completed');
            updateStats();
        }

        function updateStats() {
            document.getElementById('completedCount').textContent = completedQuestions.size;
            document.getElementById('correctCount').textContent = correctQuestions.size;
            document.getElementById('incorrectCount').textContent = completedQuestions.size - correctQuestions.size;

            const progress = (completedQuestions.size / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Initialize
        renderQuestions();
        document.getElementById('totalCount').textContent = questions.length;
    </script>
</body>
</html>
